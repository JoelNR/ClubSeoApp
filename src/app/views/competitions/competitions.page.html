<ion-content>
  <div class="flex flex-col h-full bg-gradient-to-b from-clear to-white dark:from-nightblue-10 dark:to-nightblue-90">
    <app-header></app-header>
    <div class="flex flex-col grow w-full lg:max-w-290 px-5 sm:px-8 mx-auto" [ngClass]="{'pb-14' : mobile}">
      
      <!-- Premium Page Title -->
      <h1 class="pb-2 text-center uppercase font-black tracking-widest text-nightblue dark:text-white" [ngClass]="{'pt-28' : !mobile, 'pt-8': mobile}">
        Competiciones  
      </h1>
      <p class="text-center pb-8 text-nightblue-60 dark:text-nightblue-50 font-medium">
        Encuentra y regístrate en los próximos eventos y torneos de nuestro club
      </p>

      <!-- Searchbar Container -->
      <div class="mb-8 w-full max-w-2xl mx-auto relative group/search">
        <ion-searchbar #searchbar search-icon="search-outline" [(ngModel)]="searchKeyword" (ionChange)="search()" name="searchKeyword" placeholder="Buscar una competición...">
        </ion-searchbar>
        <!-- Discreet keyboard shortcut hint -->
        <kbd class="hidden md:inline-flex absolute right-4 top-1/2 -translate-y-1/2 items-center gap-1 h-5 select-none rounded border border-solid border-nightblue-60/20 dark:border-white/10 bg-nightblue-10/50 dark:bg-nightblue-20/30 px-1.5 font-mono text-[10px] font-medium text-nightblue-60 dark:text-nightblue-50 pointer-events-none transition-opacity duration-300 group-focus-within/search:opacity-0">
          /
        </kbd>
      </div>

      <!-- Main Content Premium Card -->
      <div class="relative w-full mb-12 rounded-3xl p-6 md:p-8 bg-gradient-to-br from-white/95 via-sky-50/45 to-white/80 dark:from-nightblue-100/90 dark:via-nightblue-90/80 dark:to-nightblue-100/70 backdrop-blur-xl border border-solid border-nightblue-100/10 dark:border-white/10 shadow-xl shadow-nightblue-100/5 dark:shadow-[0_8px_30px_rgba(0,0,0,0.4)] transition-all duration-500 overflow-hidden">
        
        <!-- Glowing background decorations -->
        <div class="absolute -top-24 -right-24 w-48 h-48 rounded-full bg-orange/10 dark:bg-orange/20 blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 rounded-full bg-primary/10 dark:bg-primary/20 blur-3xl pointer-events-none"></div>

        <!-- Section Title with reset button if searching -->
        <div class="relative flex flex-col sm:flex-row sm:items-center sm:justify-between pb-6 border-b border-solid border-nightblue-100/10 dark:border-white/10 mb-6 gap-4">
          <h2 class="text-lg md:text-xl font-black text-nightblue dark:text-white uppercase tracking-widest flex items-center gap-2 select-none m-0" *ngIf="searchKeyword == ''">
            <ion-icon name="trophy-outline" class="text-orange text-xl"></ion-icon>
            Todas las competiciones
          </h2>
          <div *ngIf="searchKeyword != ''" class="flex flex-col sm:flex-row sm:items-center sm:justify-between w-full gap-4">
            <h2 class="text-lg md:text-xl font-black text-nightblue dark:text-white uppercase tracking-widest flex items-center gap-2 select-none m-0">
              <ion-icon name="search-outline" class="text-orange text-xl"></ion-icon>
              Resultados para "{{searchKeyword}}"
            </h2>
            <button class="flex items-center gap-2 px-5 py-2 rounded-full border border-solid border-orange/40 hover:border-orange/70 dark:border-white/15 dark:hover:border-white/30 bg-orange-40/15 hover:bg-orange-40/30 dark:bg-white/5 dark:hover:bg-white/10 text-orange font-extrabold text-xs uppercase tracking-wider transition-all duration-300 hover:scale-[1.03] active:scale-95 focus:outline-none" (click)="searchKeyword = ''; search()">
              <ion-icon class="text-base" name="refresh-outline"></ion-icon>
              Reiniciar búsqueda
            </button>          
          </div>
        </div>

        <!-- Future Competitions Section -->
        <div *ngIf="results.length > 0" class="relative mb-8">
          <h3 class="text-sm font-black text-orange-100 dark:text-orange uppercase tracking-wider mb-4 flex items-center gap-1.5">
            <ion-icon name="calendar-outline" class="text-base"></ion-icon>
            Próximos Eventos
          </h3>  
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div *ngFor="let competition of results" class="hover:-translate-y-1 transition-transform duration-350">
              <app-competition-card [date]="competition.date" [description]="competition.description" 
             [modality]="competition.modality" [title]="competition.title" [image]="competition.image" [link]="competition.link"></app-competition-card>
            </div>
          </div>
        </div> 

        <!-- Past Competitions Section -->
        <div *ngIf="pastResults.length > 0" class="relative mt-8">
          <h3 class="text-sm font-black text-nightblue-60 dark:text-nightblue-50 uppercase tracking-wider mb-4 flex items-center gap-1.5">
            <ion-icon name="checkmark-done-circle-outline" class="text-base"></ion-icon>
            Competiciones Finalizadas
          </h3>  
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div *ngFor="let competition of pastResults" class="opacity-85 hover:opacity-100 hover:-translate-y-1 transition-all duration-350">
              <app-competition-card [date]="competition.date" [description]="competition.description" 
             [modality]="competition.modality" [title]="competition.title" [image]="competition.image" [disableButton]="true"></app-competition-card>
            </div>
          </div>
        </div>

        <!-- No Results Fallback -->
        <div *ngIf="results.length == 0 && pastResults.length == 0" class="flex flex-col items-center justify-center py-12 text-center">
          <ion-icon name="sad-outline" class="text-5xl text-nightblue-50 dark:text-nightblue-60 mb-3"></ion-icon>
          <p class="text-base font-semibold text-nightblue-60 dark:text-nightblue-50">No se encontraron competiciones para su búsqueda.</p>
        </div>

      </div>
    </div>
    <app-footer></app-footer>
  </div>
</ion-content>
