<div (click)="openDialog($event)" (keydown.enter)="openDialog($event)" tabindex="0" role="button" class="group flex flex-col text-left rounded-2xl overflow-hidden border border-solid border-nightblue-100/10 dark:border-white/10 bg-gradient-to-br from-white/90 via-white/80 to-white/50 dark:from-nightblue-100/40 dark:to-nightblue-90/50 backdrop-blur-xl shadow-md hover:shadow-xl transition-all duration-300 hover:scale-[1.02] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-orange focus-visible:ring-offset-2 w-full no-underline cursor-pointer">
  <div class="relative overflow-hidden h-48 w-full flex-shrink-0">
    <img [src]="imgSrc" loading="lazy" width="400" height="192" alt="" class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105">
    <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
  </div>

  <div class="flex flex-col justify-between flex-grow p-4">
    <div>
      <h4 class="text-base font-bold text-nightblue dark:text-white leading-tight mb-2 tracking-tight group-hover:text-orange transition-colors duration-300">
        {{title}}
      </h4>
      <p class="text-xs text-nightblue-60 dark:text-nightblue-30 line-clamp-3 mb-4 leading-relaxed">
        {{description}}
      </p>
    </div>
    
    <div class="flex items-center justify-between border-t border-solid border-nightblue-100/10 dark:border-white/10 pt-3 mt-auto">
      <app-date-chip [date]="date" [showTimeElapsed]="true"></app-date-chip>
      <span class="flex items-center gap-1 text-[11px] font-bold text-orange group-hover:translate-x-1 transition-transform duration-300">
        Leer más <ion-icon name="arrow-forward-outline"></ion-icon>
      </span>
    </div>
  </div>
</div>

<!-- Premium Native Dialog -->
<dialog #newsDialog closedby="any" (click)="onDialogClick($event)" class="relative overflow-hidden w-full max-w-lg rounded-3xl bg-white dark:bg-nightblue-100 border border-solid border-nightblue-100/10 dark:border-white/10 text-nightblue dark:text-white outline-none">
  <!-- Dialog Header Image / Gradient overlay -->
  <div class="relative h-64 w-full">
    <img [src]="imgSrc" class="h-full w-full object-cover" alt="">
    <div class="absolute inset-0 bg-gradient-to-t from-white dark:from-nightblue-100 via-transparent to-transparent"></div>
    
    <!-- Close Button -->
    <button (click)="closeDialog(); $event.stopPropagation()" class="absolute top-4 right-4 flex items-center justify-center w-9 h-9 rounded-full bg-black/40 hover:bg-black/60 dark:bg-white/15 dark:hover:bg-white/25 text-white backdrop-blur-md border border-solid border-white/10 transition-all duration-300 hover:scale-105 active:scale-95 focus:outline-none" aria-label="Cerrar">
      <ion-icon class="text-xl" name="close-outline"></ion-icon>
    </button>
  </div>

  <!-- Dialog content -->
  <div class="p-6 sm:p-8 -mt-6 relative bg-white dark:bg-nightblue-100 rounded-t-3xl">
    <div class="flex items-center justify-between mb-4">
      <app-date-chip [date]="date"></app-date-chip>
    </div>
    
    <h3 class="text-xl sm:text-2xl font-black text-nightblue dark:text-white leading-tight mb-4 tracking-tight">
      {{title}}
    </h3>
    
    <!-- Scrollable container for text content -->
    <div class="max-h-60 overflow-y-auto pr-1 text-sm text-nightblue-80 dark:text-nightblue-20 leading-relaxed text-justify mb-6 whitespace-pre-line">
      {{description}}
    </div>

    <!-- Dialog footer action -->
    <div class="flex justify-end pt-4 border-t border-solid border-nightblue-100/10 dark:border-white/10">
      <button (click)="closeDialog(); $event.stopPropagation()" class="px-6 py-2.5 rounded-full bg-orange hover:bg-orange-80 text-white font-extrabold text-xs uppercase tracking-wider shadow-sm transition-all duration-300 hover:scale-[1.03] active:scale-95 focus:outline-none">
        Cerrar
      </button>
    </div>
  </div>
</dialog>
