<a [routerLink]="['/noticias/detalles', id]" class="group flex flex-col text-left rounded-2xl overflow-hidden border border-solid border-nightblue-100/10 dark:border-white/10 bg-gradient-to-br from-white/90 via-white/80 to-white/50 dark:from-nightblue-100/40 dark:to-nightblue-90/50 backdrop-blur-xl shadow-md hover:shadow-xl transition-all duration-300 hover:scale-[1.02] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-orange focus-visible:ring-offset-2 w-full no-underline">
  <div class="relative overflow-hidden h-48 w-full flex-shrink-0">
    <img [src]="imgSrc" loading="lazy" width="400" height="192" alt="" class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105">
    <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
  </div>

  <div class="flex flex-col justify-between flex-grow p-4">
    <div>
      <h4 class="text-base font-bold text-nightblue dark:text-white leading-tight mb-2 tracking-tight group-hover:text-orange transition-colors duration-300">
        {{title}}
      </h4>
      <p class="text-xs text-nightblue-60 dark:text-nightblue-30 line-clamp-3 mb-4 leading-relaxed">
        {{description}}
      </p>
    </div>
    
    <div class="flex items-center justify-between border-t border-solid border-nightblue-100/10 dark:border-white/10 pt-3 mt-auto">
      <app-date-chip [date]="date" [showTimeElapsed]="true"></app-date-chip>
      <span class="flex items-center gap-1 text-[11px] font-bold text-orange group-hover:translate-x-1 transition-transform duration-300">
        Leer más <ion-icon name="arrow-forward-outline"></ion-icon>
      </span>
    </div>
  </div>
</a>
