<div class="flex flex-col sm:flex-row w-full h-auto sm:h-96 md:h-[380px] overflow-hidden bg-white dark:bg-nightblue-90 border border-solid border-slate-200/50 dark:border-slate-800/40 rounded-3xl shadow-xl">
  <!-- Left Side: Content panel (Text and CTA) -->
  <div class="flex-1 p-6 sm:p-8 md:p-10 flex flex-col justify-between items-start text-left bg-gradient-to-br from-white to-slate-50 dark:from-nightblue-90 dark:to-nightblue-100">
    <div class="w-full">
      <!-- Premium dynamic badge -->
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider bg-orange/10 dark:bg-orange/20 text-orange border border-orange/20 mb-3 sm:mb-4">
        <span class="w-1.5 h-1.5 rounded-full bg-orange animate-pulse"></span>
        Destacado
      </span>
      <h2 class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-nightblue-100 dark:text-white tracking-tight leading-tight">
        {{title}}
      </h2>
      <p class="mt-3 text-nightblue-60 dark:text-nightblue-50 text-sm sm:text-base leading-relaxed max-w-md font-medium">
        {{description}}
      </p>
    </div>
    
    <div class="mt-6 sm:mt-0">
      <ion-button [routerLink]="buttonLink" color="primary" class="premium-cta-btn font-bold">
        <span>Ver más</span>
        <ion-icon name="arrow-forward-outline" slot="end" class="ml-1 transition-transform duration-300"></ion-icon>
      </ion-button>
    </div>
  </div>

  <!-- Right Side: Img panel -->
  <div class="w-full sm:w-[45%] md:w-[50%] h-52 sm:h-full relative overflow-hidden flex-shrink-0 border-t sm:border-t-0 sm:border-l border-solid border-slate-100 dark:border-slate-800/60">
    <img [src]="imgSrc" [attr.fetchpriority]="fetchPriority" width="800" height="400" 
         class="w-full h-full object-cover transition-transform duration-[1.5s] ease-out hover:scale-105 bg-image" 
         [style.object-position]="objectPosition"
         alt="">
  </div>
</div>
