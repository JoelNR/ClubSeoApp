<div class="carousel-container relative overflow-visible my-4 w-full"
     role="region" aria-roledescription="carrusel" aria-label="Destacados y promociones">
  <swiper [navigation]="{ prevEl: '.swiper-button-prev', nextEl: '.swiper-button-next' }" [pagination]="{ clickable: true }" [autoplay]="{ delay: 5000, disableOnInteraction: false }" [loop]="true" [a11y]="true" [keyboard]="true" 
          class="rounded-3xl overflow-hidden h-auto shadow-xl border border-solid border-slate-200/50 dark:border-slate-800/40 w-full">  
    <ng-template *ngIf="!isMember" swiperSlide>
      <app-swiper-item class="w-full"
        title="¿Quieres aprender a tirar con arco?" 
        description="Ven y prueba por 5€ la primera clase. Permitimos todas las edades, a partir de los 11 años" 
        imgSrc="/assets/img/iniciacion.jpg" 
        buttonLink="/iniciacion" 
        fetchPriority="high"
        objectPosition="center 20%">
      </app-swiper-item>
    </ng-template>
    <ng-template swiperSlide>
      <app-swiper-item class="w-full"
        title="¡Organizamos competiciones!" 
        description="Revisa nuestras convocatorias para no perderte nada esta temporada" 
        imgSrc="/assets/img/competicion.jpg" 
        buttonLink="/competicion" 
        [fetchPriority]="isMember ? 'high' : 'low'"
        objectPosition="center 40%">
      </app-swiper-item>
    </ng-template>
    <ng-template swiperSlide>
      <app-swiper-item class="w-full"
        title="Récords del club" 
        description="Descubre las mejores marcas registradas de nuestros arqueros y las puntuaciones a batir esta temporada." 
        imgSrc="/assets/img/flechas.jpeg" 
        buttonLink="/plusmarcas" 
        fetchPriority="low"
        objectPosition="center 50%">
      </app-swiper-item>
    </ng-template>
  </swiper>

  <!-- Custom Navigation Buttons outside Swiper to allow floating without clipping while keeping slides clipped -->
  <button class="swiper-button-prev" aria-label="Diapositiva anterior"></button>
  <button class="swiper-button-next" aria-label="Diapositiva siguiente"></button>
</div>
