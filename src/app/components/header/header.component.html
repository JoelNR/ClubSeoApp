<!-- Desktop Navigation Header Bar (Hidden on smaller screens, flex on large) -->
<header class="hidden lg:flex w-full fixed top-0 left-0 z-50 justify-center items-center bg-white/70 dark:bg-nightblue-90/75 backdrop-blur-xl border-b border-solid border-nightblue-100/10 dark:border-white/10 shadow-sm transition-all duration-300">
  <div class="justify-between flex w-full lg:max-w-290 xl:max-w-7xl items-center px-6 h-16 md:h-20">
    
    <!-- Left: Brand Logo and Title -->
    <div class="flex items-center gap-3 cursor-pointer" routerLink="/inicio">
      <img src="/assets/img/logo.png" alt="logo" width="46" height="40" class="h-10 w-auto transition-transform duration-300 hover:scale-105 dark:drop-shadow-[0_0_8px_rgba(255,255,255,0.45)]">
      <span class="hidden sm:inline-block text-xs font-black uppercase tracking-widest text-nightblue dark:text-white select-none">SEO</span>
    </div>
    
    <!-- Right: Desktop Navigation Options -->
    <nav class="text-xs lg:text-sm flex items-center gap-1 font-bold h-full">
      <a *ngFor="let option of headerOptions" [routerLink]="option.link" 
         class="px-3 lg:px-4 h-10 rounded-full inline-flex items-center justify-center gap-1.5 text-nightblue-80 dark:text-nightblue-50 transition-all duration-300 hover:bg-nightblue-100/5 dark:hover:bg-white/5 hover:text-orange-100 dark:hover:text-orange whitespace-nowrap"
         [ngClass]="{'bg-orange-40/20 dark:bg-white/5 text-orange-100 dark:text-orange border border-solid border-orange/20 dark:border-white/10': isActive(option.link)}">
        <ion-icon class="text-base" [ngClass]="{'text-orange-100 dark:text-orange': isActive(option.link)}" [name]="option.icon"></ion-icon>
        <span>{{ option.label }}</span>
      </a>
    </nav>
  </div>
</header>

<!-- Mobile Navigation Header Bar (Visible on smaller screens, hidden on large) -->
<div class="lg:hidden w-full h-16 flex fixed top-0 left-0 z-50 justify-between items-center px-5 bg-white/80 dark:bg-nightblue-90/85 backdrop-blur-md border-b border-solid border-nightblue-100/10 dark:border-white/10 shadow-sm transition-all">
  <div class="flex items-center gap-2 cursor-pointer" routerLink="/inicio">
    <img src="/assets/img/logo.png" alt="logo" width="40" height="35" class="h-8 w-auto">
    <span class="text-xs font-black uppercase tracking-widest text-nightblue dark:text-white select-none">SEO</span>
  </div>
  
  <button (click)="openProfileMenu = !openProfileMenu" class="flex items-center justify-center p-2.5 rounded-xl bg-orange/15 active:scale-95 text-orange transition-all duration-200 focus:outline-none">
    <svg width="20" height="16" viewBox="0 0 20 16" fill="none" class="stroke-current stroke-2" xmlns="http://www.w3.org/2000/svg">
      <!-- Hamburger State (Three standard parallel lines) -->
      <g *ngIf="!openProfileMenu">
        <line x1="2" y1="3" x2="18" y2="3" stroke-linecap="round" />
        <line x1="2" y1="8" x2="18" y2="8" stroke-linecap="round" />
        <line x1="2" y1="13" x2="18" y2="13" stroke-linecap="round" />
      </g>
      <!-- 'X' Close State (Two perfect diagonal crossing lines) -->
      <g *ngIf="openProfileMenu">
        <line x1="3" y1="2" x2="17" y2="14" stroke-linecap="round" />
        <line x1="17" y1="2" x2="3" y2="14" stroke-linecap="round" />
      </g>
    </svg>
  </button>
</div>

<!-- Mobile Sleek Hamburger Dropdown Menu Overlay (Visible on smaller screens when openProfileMenu is active) -->
<div *ngIf="openProfileMenu" 
     class="lg:hidden fixed inset-0 top-16 z-40 w-full bg-white/95 dark:bg-nightblue-90/95 backdrop-blur-xl transition-all duration-350 overflow-hidden flex flex-col justify-start border-b border-solid border-nightblue-100/10 dark:border-white/10 animate-[fadeIn_0.2s_ease-out]">
  
  <nav class="flex flex-col p-6 gap-3">
    <!-- Compact Home link inside list -->
    <a (click)="openProfileMenu = false" routerLink="/inicio" 
       class="w-full px-5 py-3 rounded-2xl flex items-center gap-3 text-nightblue dark:text-white font-extrabold uppercase tracking-wide text-xs bg-nightblue-100/5 dark:bg-white/5 border border-solid border-nightblue-100/5 dark:border-white/5"
       routerLinkActive="bg-orange-40/25 dark:bg-orange/20 text-orange-100 dark:text-orange border-orange/20">
      <ion-icon class="text-lg text-orange" name="home-outline"></ion-icon>
      <span>Inicio</span>
    </a>

    
    <a *ngFor="let option of headerOptions" 
       (click)="openProfileMenu = false" 
       [routerLink]="option.link" 
       class="w-full px-5 py-3 rounded-2xl flex items-center gap-3 text-nightblue dark:text-white font-extrabold uppercase tracking-wide text-xs bg-nightblue-100/5 dark:bg-white/5 border border-solid border-nightblue-100/5 dark:border-white/5"
       routerLinkActive="bg-orange-40/25 dark:bg-orange/20 text-orange-100 dark:text-orange border-orange/20">
      <ion-icon class="text-lg text-orange" [name]="option.icon"></ion-icon>
      <span>{{option.label}}</span>
    </a>
  </nav>
</div>
