<div class="group flex flex-col text-left rounded-2xl w-full max-h-fit border border-solid border-nightblue-100/10 dark:border-white/10 bg-white/70 dark:bg-nightblue-90/45 backdrop-blur-md shadow-md hover:shadow-xl hover:border-orange-80/50 dark:hover:border-orange-80/30 transition-all duration-350 overflow-hidden h-full">
  
  <!-- Image Container with zoom hover effect -->
  <div class="relative overflow-hidden aspect-video">
    <img [src]="image || '/assets/img/flechas.jpeg'" loading="lazy" width="400" height="225" alt="{{title}}" class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105">
    
    <!-- Modality Badge absolute overlay -->
    <span class="absolute top-3 right-3 px-3 py-1 rounded-full bg-nightblue-100/80 dark:bg-nightblue-10/85 backdrop-blur-sm text-[10px] font-black uppercase tracking-widest text-white dark:text-nightblue-100 border border-solid border-white/10 select-none">
      {{modality}}
    </span>
  </div>

  <!-- Content Section -->
  <div class="p-5 flex flex-col justify-between grow">
    <div>
      <div class="flex justify-between items-start pb-2">
        <app-date-chip [date]="date"></app-date-chip>
      </div>

      <h3 class="text-base font-extrabold text-nightblue dark:text-white mb-2 tracking-tight group-hover:text-orange-100 transition-colors duration-300">
        {{title}}  
      </h3>  

      <p class="text-xs text-nightblue-60 dark:text-nightblue-50 font-medium leading-relaxed mb-4 line-clamp-3">
        {{description}}
      </p>  
    </div>

    <!-- Registration Button -->
    <ion-button *ngIf="!disableButton" class="h-10 w-full text-xs font-bold uppercase tracking-wider mt-auto rounded-xl" color="primary" target="_blank" [href]="link">
      <ion-icon name="ticket-outline" slot="start" class="text-base"></ion-icon>
      Inscribirse
    </ion-button>
  </div>
</div>
